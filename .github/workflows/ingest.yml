name: Daily ingest

on:
  # 22:30 UTC, every day. After the US close (20:00-21:00 UTC depending on DST)
  # and long after the European one.
  #
  # Seven days a week on purpose. A weekend run finds no new bars and rewrites
  # near-identical artifacts, but it refreshes meta.generated_at -- which lets the
  # frontend's 36-hour staleness rule mean exactly one thing: the workflow failed.
  # A weekday-only schedule would cry wolf every Sunday morning.
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the cache and backfill 10 years"
        type: boolean
        default: false

permissions:
  contents: write

# One at a time, never cancelled: a half-finished run must not race the commit.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The price history lives here, not in the repo. Committing it would add
      # ~6 MB per day, about 1.5 GB a year, to store something reconstructible
      # from one API call. A miss is not a failure -- it triggers a full backfill.
      #
      # run_id in the key makes every run save a fresh entry (an existing key is
      # never overwritten); restore-keys then prefix-matches the most recent one.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-v1-adjclose-${{ github.run_id }}
          restore-keys: |
            prices-v1-adjclose-

      # Allowed to fail so the artifacts still get committed below. An unmapped
      # sector label should turn the build red without throwing away a good day
      # of data.
      - name: Run ingest
        id: ingest
        continue-on-error: true
        run: python -m ingest.run ${{ inputs.full && '--full' || '' }}

      - name: Commit artifacts
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "no change to data/"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: ingest $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Belt and braces. Render's auto-deploy usually catches the push on its own,
      # but if it is off -- or silently misses a commit -- the ingest keeps writing
      # fresh data to the repo while the site serves yesterday's numbers, and the
      # only clue is the staleness banner 36 hours later. This makes the deploy an
      # explicit step of the pipeline instead of an assumption about it.
      #
      # The hook URL is a secret and must never be committed: this repo is public.
      # Set it at Settings -> Secrets and variables -> Actions -> RENDER_DEPLOY_HOOK.
      # Absent, this step is skipped and nothing breaks.
      - name: Trigger Render deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK not set; relying on Render auto-deploy"
            exit 0
          fi
          # --fail so an HTTP error is a build failure rather than a silent no-op.
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          echo "::notice::Render deploy triggered"

      - name: Surface any ingest failure
        if: steps.ingest.outcome != 'success'
        run: |
          echo "::error::ingest exited non-zero -- check for unmapped sectors in data/meta.json"
          exit 1
